<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>John™ - Visuals</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"/>
<style>
    body {
        background-color: #0a0a0c;
        color: #ffffff;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
    }
    
    .glass-panel {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .social-btn:hover {
        background: rgba(0, 251, 255, 0.1);
        border-color: #00FBFF;
        box-shadow: 0 0 20px rgba(0, 251, 255, 0.2);
        transform: translateY(-2px);
    }

    .image-card {
        overflow: hidden;
        position: relative;
    }

    .image-card img {
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
        filter: grayscale(20%) brightness(0.8);
    }

    .image-card:hover img {
        transform: scale(1.05);
        filter: grayscale(0%) brightness(1.1);
    }

    .image-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

    .image-card:hover::after {
        opacity: 1;
    }

    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #0a0a0c; 
    }
    ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #00FBFF; 
    }
</style>
</head>
<body class="min-h-screen py-16 px-6 md:px-12 flex flex-col items-center gap-16">

    <header class="flex flex-col items-center gap-4 text-center mt-8">
        <h1 class="text-5xl md:text-7xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-gray-100 to-gray-500 drop-shadow-lg">
            John™
        </h1>
        <div class="h-px w-24 bg-gradient-to-r from-transparent via-[#00FBFF] to-transparent"></div>
    </header>

    <section class="flex flex-wrap justify-center gap-6 w-full max-w-2xl">
        <a href="https://discord.com" target="_blank" class="glass-panel social-btn px-10 py-4 rounded-full flex items-center justify-center gap-3 w-full sm:w-auto cursor-pointer text-[#00FBFF] font-bold tracking-widest uppercase text-sm">
            Discord
        </a>
        <a href="https://roblox.com" target="_blank" class="glass-panel social-btn px-10 py-4 rounded-full flex items-center justify-center gap-3 w-full sm:w-auto cursor-pointer text-[#00FBFF] font-bold tracking-widest uppercase text-sm">
            Roblox
        </a>
    </section>

    <section class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 md:gap-8">
        
        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=800" alt="Showcase 1" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=800" alt="Showcase 2" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&q=80&w=800" alt="Showcase 3" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1534423861386-85a16f5d13fd?auto=format&fit=crop&q=80&w=800" alt="Showcase 4" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1605810230434-7631ac76ec81?auto=format&fit=crop&q=80&w=800" alt="Showcase 5" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

        <div class="glass-panel p-2 rounded-2xl image-card">
            <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b7738?auto=format&fit=crop&q=80&w=800" alt="Showcase 6" class="w-full h-[300px] md:h-[400px] object-cover rounded-xl" />
        </div>

    </section>

</body>
</html>
